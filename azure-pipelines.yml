trigger:
- main
pool:
  vmImage: ubuntu-latest
steps:
- checkout: self
- script: |
    docker build -t internship-web:$(Build.BuildId) .
  displayName: Build container image
- script: |
    set -e
    docker run -d --name web-test -p 8080:80 internship-web:$(Build.BuildId)
    trap 'docker logs web-test; docker rm -f web-test' EXIT
    curl --fail --retry 10 --retry-all-errors --retry-delay 2 --max-time 10 http://localhost:8080 -o response.html
    grep -Fq "DevOps Pipeline is Working!" response.html
  displayName: Test that the web page works
- task: AzureCLI@2
  displayName: Push tested image to ACR
  inputs:
    azureSubscription: 'Azure-Service-Connection'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
  set -e
  az acr login --name acrsani09
  docker tag internship-web:$(Build.BuildId) acrsani09.azurecr.io/internship-web:$(Build.BuildId)
  docker push acrsani09.azurecr.io/internship-web:$(Build.BuildId)
- task: AzureCLI@2
  displayName: Deploy image to App Service
  inputs:
    azureSubscription: 'Azure-Service-Connection'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
  set -e
  az webapp sitecontainers update 
    --name devops-internship 
    --resource-group devops-internship_group 
    --container-name main 
    --image acrsani09.azurecr.io/internship-web:$(Build.BuildId) 
    --target-port 80 
    --system-assigned-identity true
